<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: pink;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 5vw;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 5vw;
            width: 100%;
            padding: 2vw;
        }

        .shop {
            width: 40%;
        }

        .shop img {
            width: 100%;
            max-width: 100%;
            height: auto;
        }

        hr {
            width: 100%;
            border: 0;
            border-top: 1px solid black;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            padding-right: 10px;
        }
    </style>
</head>

<body>

    <h1>Online_Shops</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/assets/ca5d12864c12916c05640b36e47ac5c9.png" alt="Online Shop 1">
            <br>
            <a href="https://shopee.co.th/">shopee</a>
        </div>

        <div class="shop">
            <img src="https://assets.grab.com/wp-content/uploads/sites/10/2026/06/15114447/Teaser-UpdateApp-1200x1200-LMTH6331-GrabFood-50-50Campaign-2.png" alt="Online Shop 2">
            <br>
            <a href="https://www.grab.com/">grab</a>
        </div>

    </div>

    <hr>

    <div class="copyright">
        © phsilaar 2026
    </div>

</body>
</html>
