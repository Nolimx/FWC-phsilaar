<!DOCTYPE html>
<html>
<head>
    <title>Two Boxes</title>

    <style>
        table {
            width: 90%;
            margin: 10px auto;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            height: 120px;
            border: 1px solid black;
        }

        .first {
            background-color: rgb(0, 115, 255);
        }

        .second {
            background-color: rgb(215, 213, 213);
        }
    </style>
</head>

<body>

    <hr>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
