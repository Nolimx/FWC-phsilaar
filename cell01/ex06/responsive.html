<!DOCTYPE html>
<html>
<head>
    <title>Two Boxes</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
            height: 100vh;
            margin: 0;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            height: 100%;
            border: 1px solid black;
        }

        .first {
            background-color: rgb(0, 115, 255);
        }

        .second {
            background-color: rgb(215, 213, 213);
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
